<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/theme.css?v=5.0}">

    <style>
        html,
        body {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>

<body>

    <div class="card shadow" style="width: 400px;">
        <div class="card-body text-center">
            <h4 class="card-title py-4 text-decoration-underline">Admin Login</h4>

            <div th:if="${errorMsg}" class="mb-3 alert alert-danger" role="alert">
            	<span th:text="${errorMsg}"></span>
			</div>

            <form action="adminLoginForm" method="POST">
                <div class="mb-3 text-start">
                    <label for="exampleInputEmail1" class="form-label">Admin Email :</label>
                    <input type="email" name="adminemail" class="form-control" />
                </div>
                <div class="mb-3 text-start">
                    <label for="exampleInputPassword1" class="form-label">Admin Password :</label>
                    <input type="password" name="adminpass" class="form-control" />
                </div>
                <div class="mb-3 text-end">
                    <a href="#" onclick="fillAdminDemo(); return false;" class="text-decoration-none small text-muted">Demo Admin Fill</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="mt-4 pt-3 border-top text-center d-flex justify-content-center align-items-center gap-3">
                <a href="login" class="text-secondary text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i> Student Login
                </a>
                <span class="text-muted small">•</span>
                <a href="employeeLogin" class="text-secondary text-decoration-none small">
                    <i class="bi bi-briefcase me-1"></i> Employee Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        function fillAdminDemo(autoSubmit = false) {
            document.querySelector('input[name="adminemail"]').value = 'admin@gmail.com';
            document.querySelector('input[name="adminpass"]').value = 'admin123';
            if (autoSubmit) {
                document.forms[0].submit();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('autofill') === 'true') {
                fillAdminDemo(false);
            }
        });
    </script>
</body>

</html>
